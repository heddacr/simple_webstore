                </a></li>

                    <figure> <img src='Medier/handlekurvIkon.png' alt='handlekurv'></figure>

        <table> <!-- lager en tabell -->
            <tr>
                <!-- Lager felt for brukerinput -->
                <td><label for="brukernavn">Navn:</label></td>
                <td><input type="text" id="brukernavn" placeholder="Hedda Crosby"></td>
            </tr>

    <!--Henviser til lagrede js filer-->
    <script src="js/produkter.js"></script>
    <script src="js/funksjoner.js"></script>

    <script>
        //definerer nødvendige variabler:
        let htmlTekst = "";

        //henter produktid-parameteren fra URL-en:
        const params = new URL(location.href).searchParams; //hentet fra https://stackoverflow.com/questions/523266/how-can-i-get-a-specific-parameter-from-location-search 
        const produktid = params.get('produktid');

        //Lager html for å vise detaljene om produktet
        let valgtProdukt = produkter[produktid];
        htmlTekst += "<div id='detaljerOppbevaring'>";
        htmlTekst += "<div><figure> <img src = 'Medier/" + valgtProdukt.navn + "(Large).jpeg' alt='produktbilde'></figure></div>";
        htmlTekst += "<div id='detaljerTekst'>"
        htmlTekst += "<h2>" + valgtProdukt.navn + "</h2>";
        htmlTekst += "<p>" + valgtProdukt.pris + " kr</p>";
        htmlTekst += "<button onclick='leggTilHandlekurv(" + produktid + ")'>legg til handlekurv</button>";
        htmlTekst += "</div></div>";
        produktVisning.innerHTML = htmlTekst;
    </script>
</body>
