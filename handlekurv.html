    <script>

        function fjernFraHandlekurv(i) {
            let index = produkterTilHandlekurv.indexOf(produkterTilHandlekurv[i]); //Finner det slettede produktet i handlekurv-arrayen
            if (index !== -1) { //sjekker at produktet ble funnet
                produkterTilHandlekurv.splice(index, 1); //tar ut produktet
                oppdaterHandlekurv();
                produktteller();
                lagreHandlekurv();
            }
        }

        function oppdaterHandlekurv() {
            let htmlTekst = "";
            let sum = 0;

            //Lager html for å vise detaljene om produktene i handlekurven
            for (let i = 0; i < produkterTilHandlekurv.length; i++) {
                let produktNummer = produkterTilHandlekurv[i];
                let produkt = produkter[produktNummer];
                htmlTekst += "<div>";
                htmlTekst += "<br>";
                htmlTekst += "<table><tr><td>"
                htmlTekst += "<figure> <img src = 'Medier/" + produkt.navn + "(Small).jpeg' alt='produktbilde'></figure>";
                htmlTekst += "</td><td>"
                htmlTekst += "<h4>" + produkt.navn + "</h4>";
                htmlTekst += "<p>" + produkt.pris + " kr </p>";
                htmlTekst += "<button onclick='fjernFraHandlekurv(" + i + ")'>fjern fra handlekurv</button>";
                htmlTekst += "</td></tr></table></div>";
                sum += produkt.pris; //legger sammen summen av prisene 
            }

            handlekurvVisning.innerHTML = htmlTekst;
            totalsum.innerHTML = "<p> <b> Totalsum: " + sum + "</b></p>";

        }
    </script>
    
    <script>
        lastHandlekurv();
        produktteller();
        oppdaterHandlekurv();
    </script>
