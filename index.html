 <script src="js/produkter.js"></script>
 <script src="js/funksjoner.js"></script>

  <script>

        </div>

  <div id="intro">
    <div>
      <figure> <!--Boks for å oppbevare bilde-->
        <img src="medier/logo_utenTekst.png" alt="Logo">

    <h3>Rettigheteter</h3>
    <p><a href="kilder.html">Kilder</a></p>

    <table> <!-- lager en tabell -->

        <!-- Lager felt for brukerinput -->

        <td><input type="text" id="mail" placeholder="hedda.crosby@gmail.com"></td>

        <td><textarea id="melding" placeholder="Jeg lurte på om.."></textarea></td>
      </tr>
    </table>

    <br>
    <button onclick="sendMelding()">Send</button>

    <br>
    <p id="tilbakemeldingMelding"></p>
    <br>

  </footer>

  <script>

    let htmlTekst = "";
    let htmlTekst2 = "";


    //Lager html for å vise detaljene om produktene i handlekurven
    for (let i = 0; i < produkter.length; i++) {
      let produkt = produkter[i];
      if (produkt.favoritt == "true") {
        htmlTekst += "<div>";
        htmlTekst += "<figure> <img src = 'Medier/" + produkt.navn + ".jpg' alt='produktbilde'></figure>";
        htmlTekst += "<h4>" + produkt.navn + "</h4>";
        htmlTekst += "<p>" + produkt.pris + " kr </p>";
        htmlTekst += "<p><a href='detaljer.html?produktid=" + i + "''>se mer.. </a></p>"
        htmlTekst += "<br><button onclick='leggTilHandlekurv(" + i + ")'>legg til handlekurv</button>";
        htmlTekst += "</div>";

      }
    }

    favoritterKarusell.innerHTML = htmlTekst;

    //Lager html for å vise detaljene om produktene i handlekurven
    for (let i = produkter.length - 1; i >= produkter.length - 7; i--) {
      let produkt = produkter[i];
      htmlTekst2 += "<div>";
      htmlTekst2 += "<figure> <img src = 'Medier/" + produkt.navn + ".jpg' alt='produktbilde'></figure>";
      htmlTekst2 += "<h4>" + produkt.navn + "</h4>";
      htmlTekst2 += "<p>" + produkt.pris + " kr </p>";
      htmlTekst2 += "<p><a href='detaljer.html?produktid=" + i + "''>se mer.. </a></p>"
      htmlTekst2 += "<button onclick='leggTilHandlekurv(" + i + ")'>legg til handlekurv</button>";
      htmlTekst2 += "</div>";
    }

    nyligLagtTil.innerHTML = htmlTekst2;
    
  
    produktteller();
  </script>
</body>

</html>
