    <script>

  <nav>

      <li><a href="index.html">
          <figure> <img src='Medier/hjemIkon.png' alt='hjem'></figure>
        </a></li>
      <li id="handlekurv"><a href="handlekurv.html">
          <figure> <img src='Medier/handlekurvIkon.png' alt='handlekurv'></figure>
      </li>

        <a href="javascript:void(0)" class="dropbtn">Dameklær</a>

  <h2>Kjoler</h2>
  <div class="salgsbilderVisning" id="vinsningProdukter"></div>


  <footer>
    <h3>Rettigheteter</h3>
    <p><a href="kilder.html">Kilder</a></p>
    <p><a href="bilder.html">Bilder</a></p>

    <br>
    <h3>Kontakt oss</h3>


    <table> <!-- lager en tabell -->
      <tr>
        <!-- Lager felt for brukerinput -->
        <td><label for="brukernavn">Navn:</label></td>
        <td><input type="text" id="brukernavn" placeholder="Hedda Crosby"></td>
      </tr>
      <tr>
        <td><label for="mail">Adresse: </label></td>
        <td><input type="text" id="mail" placeholder="hedda.crosby@gmail.com"></td>
      </tr>
      <tr>
        <td><label for="melding">Melding: </label></td>
        <td><textarea id="melding" placeholder="Jeg lurte på om.."></textarea></td>
      </tr>
    </table>

    <br>
    <button onclick="sendMelding()">Send</button>

    <br>
    <p id="tilbakemeldingMelding"></p>
    <br>

  </footer>



  <script>
    let htmlTekst = "";


    //Lager html for å vise detaljene om produktene i handlekurven
    for (let i = 0; i < produkter.length; i++) {
      let produkt = produkter[i];
      if (produkt.kategori == "kjole" && produkt.kjonn == "k") {
        htmlTekst += "<div class='salgsbilderOppbevaring'>";
        htmlTekst += "<figure> <img src = 'Medier/" + produkt.navn + ".jpg' alt='produktbilde'></figure>";
        htmlTekst += "<h4>" + produkt.navn + "</h4>";
        htmlTekst += "<p>" + produkt.pris + " kr</p>";
        htmlTekst += "<p><a href='detaljer.html?produktid=" + i + "''>se mer.. </a></p>"
        htmlTekst += "<br>";
        htmlTekst += "<button onclick='leggTilHandlekurv(" + i + ")'>legg til handlekurv</button>";
        htmlTekst += "</div>";
      }
    }

    vinsningProdukter.innerHTML = htmlTekst;

    produktteller();

  </script>
</body>

</html>
